<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mindora — AI Language Mentor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    background:#0e1026; color:#eaf0ff; font-family: system-ui;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; margin:0; text-align:center;
  }
  button {
    background:linear-gradient(180deg,#3b8dff,#2856e0);
    border:none; border-radius:12px; padding:12px 22px;
    color:white; font-size:16px; cursor:pointer; margin-top:20px;
  }
</style>
</head>
<body>
  <h1>🌐 Mindora</h1>
  <p>AI-наставник по изучению языков</p>
  <button id="btn">Запустить обучение</button>
  <script>
    const tg = window.Telegram?.WebApp;
    tg?.expand(); tg?.ready();
    document.getElementById('btn').onclick = () => {
      tg?.sendData('start');
      alert('Mindora готова! 🚀 (интеграция с ботом скоро)');
    };
  </script>
</body>
</html>
